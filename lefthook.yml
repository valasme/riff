pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    - name: rustfmt
      glob: "*.rs"
      run: cd src-tauri && cargo fmt --check

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: tests
      run: pnpm test
    - name: cargo-test
      run: cd src-tauri && cargo test
