name: Bug report
description: Something in Riff does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Appearance
        2. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings → About → Copy diagnostics. Your home directory is replaced
        with $HOME automatically, so this is safe to paste publicly.
      render: text
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: Fedora 43, Hyprland
    validations:
      required: true
